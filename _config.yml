title: Attacktive Directory — Enterprise Active Directory Attack Chain
description: Professional TryHackMe Active Directory walkthrough and Red Team case study.
theme: jekyll-theme-hacker

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: true

titles_from_headings:
  enabled: true
  strip_title: true
  collections: true

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

include:
  - assets
  - README.md
